[package]
name = "cusd-plus"
version = "0.1.0"
description = "USDY-backed cUSD+ vault for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cusd_plus"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
