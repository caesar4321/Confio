type UserType {
  id: ID!

  """Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only."""
  username: String!
  firstName: String!
  lastName: String!
  email: String
  createdAt: DateTime!

  """User's country ISO code for phone number"""
  phoneCountry: UsersUserPhoneCountryChoices
  phoneNumber: String

  """Provider where the wallet backup was last verified"""
  backupProvider: UsersUserBackupProviderChoices
  isIdentityVerified: Boolean
  isOtpVerified: Boolean
  lastVerifiedDate: DateTime
  verificationStatus: String
  accounts: [AccountType]
  isStaff: Boolean
  requiresBackupCompletion: Boolean

  """
  Which onboarding modal (if any) should the client render next: ICP > RATING > NONE
  """
  pendingModal: PendingModalEnum
  confioIcpCapturedAt: DateTime
  confioRatingPromptedAt: DateTime

  """Referral tier: member, early_supporter, community_builder, embajador"""
  statusTier: String

  """Number of successful referrals"""
  referralCount: Int

  """Name of the next tier to unlock (null if max)"""
  nextTierName: String

  """Referrals still needed for next tier (0 if max)"""
  nextTierReferralsNeeded: Int

  """
  Verified Badge: earned by having 1+ referral with claimable/claimed reward
  """
  isReferralVerified: Boolean
}

