  address: String!

  """The EOA's account nonce at signing"""
  nonce: String!
  yParity: Int!
  r: String!
  s: String!
}

"""One call of a 7702 sponsored batch."""
input BscCallInput {
  to: String!

  """Must be '0' under current policy"""
  valueWei: String!

  """0x-prefixed calldata"""
  data: String!
}

