{% load humanize %}
<h2 class="section-title">📱 Device OS Stats</h2>
<div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">iOS Users</div>
            <div class="metric-value">{{ os_stats.ios_count|intcomma }}</div>
            <div class="metric-change">{{ os_stats.ios_pct|floatformat:1 }}% of users</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Android Users</div>
            <div class="metric-value">{{ os_stats.android_count|intcomma }}</div>
            <div class="metric-change">{{ os_stats.android_pct|floatformat:1 }}% of users</div>
        </div>
    </div>
