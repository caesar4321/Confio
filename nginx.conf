user nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    # Everything before the "?" of the ORIGINAL request line, un-decoded.
    # GraphQL accepts a whole operation in the URL, so "$request" puts
    # mutations and their arguments in the access log, where no resolver can
    # reach them. $uri would do, but it is percent-decoded, so a crafted path
    # could forge a log line; $request_uri cannot.
    map $request_uri $request_path {
        "~^(?<confio_request_path>[^?]*)" $confio_request_path;
    }

    # Same treatment for the Referer: it is a full URL, so an alternate
    # route (/graphql without the slash, or the port-80 redirect) would
    # otherwise log the query string of wherever the request came from.
    map $http_referer $referer_path {
        "~^(?<confio_referer_path>[^?]*)" $confio_referer_path;
    }

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    types_hash_bucket_size 128;
    server_tokens off;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    # No query strings anywhere, not only on /graphql/: the HTTP redirect
    # server, a request to /graphql without the trailing slash, and every
    # other route inherit this one.
    log_format timed_combined '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                              '$status $body_bytes_sent "$referer_path" '
                              '"$http_user_agent" $request_time $upstream_response_time';
    # The API route drops the referer entirely: nothing links to an API
    # endpoint, so a referer there is noise at best.
    log_format timed_api '$remote_addr - $remote_user [$time_local] "$request_method $request_path $server_protocol" '
                         '$status $body_bytes_sent "$http_user_agent" $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log timed_combined;
    error_log /var/log/nginx/error.log;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Keep CSP at the edge; let Django own the overlapping standard security headers.
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Virtual Host Configs (matches production EC2)
    server {
        listen 443 ssl;
        server_name confio.lat www.confio.lat;

        # Prefer web build static for JS/CSS
        location ^~ /static/js/ {
            alias /opt/confio/web/build/static/js/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        location ^~ /static/css/ {
            alias /opt/confio/web/build/static/css/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        location ^~ /static/media/ {
            alias /opt/confio/web/build/static/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        root /var/www/confio;
        index index.html;

        ssl_certificate /etc/letsencrypt/live/confio.lat/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/confio.lat/privkey.pem;

        # Well-known endpoints
        location = /.well-known/assetlinks.json {
            alias /opt/confio/web/.well-known/assetlinks.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /.well-known/apple-app-site-association {
            alias /opt/confio/web/.well-known/apple-app-site-association;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location = /apple-app-site-association {
            alias /opt/confio/web/.well-known/apple-app-site-association;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }
        location ^~ /.well-known/ {
            alias /opt/confio/web/.well-known/;
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Static/media
        location /static/ {
            alias /opt/confio/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        location /media/ {
            alias /opt/confio/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
        location /images/ {
            alias /opt/confio/web/build/images/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # App upstream (Daphne)
        location ^~ /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location ^~ /graphql/subscriptions/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        # Prefix, not exact match: /graphql (no slash) would otherwise fall
        # through to the catch-all below and proxy with its query string
        # intact. The longer ^~ /graphql/subscriptions/ prefix above still
        # wins for websockets.
        location ^~ /graphql {
            # Our clients always POST the operation in the body. A query
            # string here can only be an operation smuggled into the URL,
            # where it would reach the access log, the error log on an
            # upstream failure, and any Referer sent onward - none of which
            # a resolver can clean up afterwards. Refusing before the proxy
            # means an upstream outage cannot log it either.
            if ($args) { return 400; }
            access_log /var/log/nginx/access.log timed_api;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }

    server {
        listen 80;
        server_name confio.lat www.confio.lat;
        return 301 https://$server_name$request_uri;
    }
}
